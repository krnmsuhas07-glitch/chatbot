<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chatbot</title>
    <link href="style.css" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="icon" href="gemini-chatbot-logo.svg">
</head>

<body>
    <div class="container">
        <header>
            <div class="first-header">
                <h1>Hello There</h1>
                <div class="sub-header">
                    <h2 id="h2">How can i help u...</h2>
                </div>
            </div>

        </header>
        <ul class="suggestions-box" type="button">
            <li class="suggestions-box">
                <button class="suggestions-boxbtn" type="button">
                    <div class="suggesstions">
                        <p class="text">Teach me something genuinely useful that I can apply in real life today.</p>
                        <span class="material-symbols-outlined">
                            self_improvement
                        </span>
                    </div>
                </button>
            </li>
            <li class="suggestions-box">
                <button class="suggestions-boxbtn" type="button">
                    <div class="suggesstions" type="button">
                        <p class="text">Challenge my thinking with a topic, question, or idea that will make me think
                            deeper
                        </p>
                        <span class="material-symbols-outlined">
                            star
                        </span>
                    </div>
                </button>
            </li>
            <li class="suggestions-box">
                <button type="button" class="suggestions-boxbtn">
                    <div class="suggesstions" type="button">
                        <p class="text">Help me plan today's DSA + development schedule without burning myself out</p>
                        <span class="material-symbols-outlined">
                            code
                        </span>

                    </div>
                </button>
            </li>
            <li class="suggestions-box">
                <button type="button" class="suggestions-boxbtn">
                    <div class="suggesstions" type="button">
                        <p class="text">Quiz me on JavaScript concepts I’ve learned so far, one question at a time.</p>
                        <span class="material-symbols-outlined">
                            javascript
                        </span>
                    </div>
                </button>
            </li>
        </ul>
        <div class="chatlogs">
        </div>
        <div class="prompt-container">
            <div class="prompt-text">
                <form action="#" class="promptform">
                    <input type="text" placeholder="ask chatbot" class="input" required>
                    <div class="prompt-actions">
                        <button type="button" id="send-arrow" class="material-symbols-outlined">arrow_upward</button>
                    </div>

                </form>
                <button id="toogle-theme" class="material-symbols-outlined">light_mode</button>

            </div>
            <div class="warning">
                <p class="warning">My chatbot can make mistakes please re check it..<span
                        class="material-symbols-outlined">
                        sentiment_calm
                    </span></p>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="app.js"></script>


</body>

</html>
